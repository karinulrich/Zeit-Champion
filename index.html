<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeit-Champion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --acc:#FFC93C; --acc-dark:#D99A00; --acc-bg:#FFF1C2; --head-ink:#4A3300;
    --ink:#1F3550; --muted:#4F6580; --ok:#3FAE3A; --ok-dark:#2C8A28; --ok-bg:#DDF5D3; --bad:#E5484D; --bad-bg:#FDE1E1; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; overflow:hidden}
  body{font-family:'Andika',system-ui,sans-serif; color:var(--ink); display:flex; flex-direction:column; height:100dvh;
       background:#D9ECFF radial-gradient(#ffffff 2.2px, transparent 2.8px) 0 0/26px 26px; user-select:none; -webkit-user-select:none}
  button{font-family:inherit; color:inherit; cursor:pointer}
  img{mix-blend-mode:multiply}
  header{display:flex; align-items:center; gap:12px; padding:8px 14px; background:var(--acc); border-bottom:5px solid var(--acc-dark); flex:0 0 auto}
  header h1{margin:0; font-size:clamp(18px,min(4vh,5.2vw),34px); line-height:1.1; flex:1; color:var(--head-ink); letter-spacing:.5px}
  .imgbubble{background:#fff; border-radius:50%; width:clamp(40px,7vh,62px); height:clamp(40px,7vh,62px); display:flex; align-items:center; justify-content:center; border:3px solid var(--acc-dark); overflow:hidden}
  .imgbubble img{max-width:82%; max-height:82%}
  .back{border:3px solid var(--acc-dark); background:#fff; border-radius:14px; padding:6px 12px; font-size:clamp(14px,2.2vh,18px); font-weight:700; text-decoration:none; color:var(--ink); white-space:nowrap; box-shadow:0 3px 0 var(--acc-dark)}
  main{flex:1; min-height:0; display:flex; flex-direction:column; padding:12px 14px; gap:10px; max-width:920px; width:100%; margin:0 auto}
  .screen{flex:1; min-height:0; display:flex; flex-direction:column; gap:10px}
  .hint{margin:0; font-size:clamp(16px,min(2.6vh,4.4vw),22px); color:var(--muted); text-align:center; background:rgba(255,255,255,.75); border-radius:14px; padding:6px 10px}
  .bar{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; flex:0 0 auto; padding-bottom:4px}
  .btn{border:3px solid var(--acc-dark); background:var(--acc); color:var(--head-ink); font-weight:700; border-radius:16px; padding:9px 22px;
       font-size:clamp(17px,min(2.8vh,4.6vw),24px); box-shadow:0 5px 0 var(--acc-dark); transition:transform .08s, box-shadow .08s}
  .btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--acc-dark)}
  .btn.light{background:#fff; color:var(--ink)}
  /* menu */
  .menu-top{display:flex; align-items:center; justify-content:center; flex:0 1 auto; min-height:0}
  .menu-top img{max-height:20vh; max-width:60%; animation:wiggle 3s ease-in-out infinite}
  @media (max-height:560px){ .menu-top{display:none} }
  @keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .menu{max-width:860px}
  .tile{background:#fff; border:4px solid var(--acc-dark); border-radius:22px; padding:clamp(8px,1.8vh,18px) 10px; display:flex; flex-direction:column; align-items:center; gap:2px;
        box-shadow:0 6px 0 var(--acc-dark); transition:transform .1s, box-shadow .1s}
  .tile:active{transform:translateY(5px); box-shadow:0 1px 0 var(--acc-dark)}
  .tile{justify-content:center; height:calc(100% - 6px); overflow:hidden; padding:4px 8px}
  .tile .ico{font-size:calc(var(--fs,22px) * 1.4); line-height:1.1}
  .tile b{font-size:var(--fs,22px); line-height:1.15}
  .tile small{font-size:calc(var(--fs,22px) * .62); color:var(--muted); line-height:1.2}
  .menu.compact .tile small{display:none}
  .menu.tiny .tile .ico{display:none}
  /* cards */
  .card{display:flex; align-items:center; justify-content:center; text-align:center; background:#fff; border:3px solid var(--acc-dark); border-radius:16px;
        font-size:clamp(18px,min(3.4vh,5.4vw),32px); box-shadow:0 5px 0 var(--acc-dark); position:relative; padding:4px 6px;
        transition:background .15s, border-color .15s, transform .08s, box-shadow .08s; touch-action:none}
  button.card:active{transform:translateY(4px); box-shadow:0 1px 0 var(--acc-dark)}
  .card.sel{background:var(--acc-bg); transform:translateY(-3px); box-shadow:0 8px 0 var(--acc-dark)}
  .card.target{background:var(--acc-bg); border-style:dashed}
  .card.drag{z-index:10; transition:none; opacity:.92}
  .card.ok{background:var(--ok-bg); border-color:var(--ok-dark); box-shadow:0 5px 0 var(--ok-dark)}
  .card.bad{background:var(--bad-bg); border-color:var(--bad); box-shadow:0 5px 0 var(--bad)}
  .card.done{opacity:.35}
  .shake{animation:shake .35s}
  @keyframes shake{0%,100%{translate:0}25%{translate:-9px}75%{translate:9px}}
  .pop{animation:pop .4s}
  @keyframes pop{0%{scale:1}45%{scale:1.15}100%{scale:1}}
  /* order */
  .fit{flex:1; min-height:0; display:grid; gap:10px; align-content:center; justify-content:stretch; width:100%; margin:0 auto}
  .fit > *{min-height:0; min-width:0}
  .fit .card{font-size:var(--fs,22px); height:calc(100% - 5px); padding:2px 4px; overflow:hidden}
  .order{grid-auto-flow:column; max-width:820px}
  .row{display:flex; gap:6px; align-items:stretch}
  .num{flex:0 0 clamp(26px,5vh,46px); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:clamp(15px,2.6vh,22px); color:var(--muted)}
  .row .card{flex:1; min-width:0}
  /* race */
  .clock{text-align:center; font-size:clamp(24px,4.4vh,42px); font-weight:700; background:#fff; border:3px solid var(--acc-dark); border-radius:16px; align-self:center; padding:2px 22px; box-shadow:0 4px 0 var(--acc-dark)}
  .found{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; min-height:clamp(30px,4.6vh,42px); flex:0 0 auto}
  .chip{background:var(--ok-bg); border:2px solid var(--ok-dark); border-radius:10px; padding:2px 9px; font-size:clamp(13px,2.2vh,19px)}

  /* quiz, gap, copy */
  .progress{display:flex; gap:5px; justify-content:center; flex-wrap:wrap; flex:0 0 auto}
  .dot{width:clamp(11px,1.8vh,17px); height:clamp(11px,1.8vh,17px); border-radius:50%; background:#fff; border:2px solid #9DB3CA}
  .dot.done{background:var(--ok); border-color:var(--ok-dark)}
  .dot.now{background:var(--acc); border-color:var(--acc-dark); scale:1.25}
  .question{flex:0 0 auto; background:#fff; border:4px solid var(--acc-dark); border-radius:20px; padding:clamp(10px,2.6vh,26px); text-align:center;
            font-size:clamp(21px,min(4.2vh,6vw),38px); line-height:1.35; box-shadow:0 6px 0 var(--acc-dark)}
  .question small{display:block; font-size:.55em; color:var(--muted)}
  .word{letter-spacing:2px; font-size:1.35em; font-weight:700}
  .gapbox{display:inline-block; min-width:1.4em; border-bottom:5px solid var(--acc-dark); background:var(--acc-bg); border-radius:8px 8px 0 0; padding:0 .12em; color:var(--ok-dark)}

  .inputwrap{display:flex; flex-direction:column; align-items:center; gap:10px; flex:1; min-height:0; justify-content:center}
  .inputwrap input{font-family:inherit; font-size:clamp(24px,min(4.6vh,7vw),42px); text-align:center; width:min(100%,520px); padding:8px 12px; border:4px solid var(--acc-dark); border-radius:16px; outline:none; color:var(--ink); background:#fff}
  .inputwrap input.ok{border-color:var(--ok-dark); background:var(--ok-bg)}
  .inputwrap input.bad{border-color:var(--bad); background:var(--bad-bg)}
  .feedback{min-height:1.6em; font-size:clamp(16px,2.6vh,22px); color:var(--muted); text-align:center; background:rgba(255,255,255,.8); border-radius:12px; padding:2px 10px}
  /* sort */
  @media (orientation:landscape){ .baskets{grid-template-columns:repeat(4,minmax(0,1fr))} }
  .pool{display:flex; flex-wrap:wrap; gap:9px; justify-content:center; flex:0 0 auto; min-height:clamp(46px,8vh,80px); padding-bottom:4px}
  .pool .card{padding:6px 14px; font-size:clamp(16px,min(2.8vh,4.4vw),26px)}
  .baskets{flex:1; min-height:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
  .basket{border:4px dashed; border-radius:20px; display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px; min-height:0; background:rgba(255,255,255,.8); cursor:pointer}
  .basket h3{margin:0; font-size:clamp(17px,min(3vh,4.6vw),26px)}
  .basket .in{display:flex; flex-wrap:wrap; gap:6px; justify-content:center}
  .basket.target{background:#fff; border-style:solid}
  .basket.flash{animation:shake .35s}
  /* praise */
  .overlay{position:fixed; inset:0; background:rgba(31,53,80,.5); display:none; align-items:center; justify-content:center; padding:20px; z-index:50}
  .overlay.on{display:flex}
  #confetti{position:fixed; inset:0; pointer-events:none; z-index:60}
  .praise{max-height:100%; overflow:auto; background:#fff; border-radius:26px; padding:22px; text-align:center; max-width:440px; width:100%; border:5px solid var(--acc-dark); box-shadow:0 8px 0 var(--acc-dark); animation:bounce .5s}
  @keyframes bounce{0%{scale:.6; opacity:0}60%{scale:1.06; opacity:1}100%{scale:1}}
  .praise img{max-height:20vh; max-width:55%}
  .praise h2{margin:6px 0; font-size:clamp(26px,4.6vh,38px)}
  .praise p{margin:0 0 16px; font-size:clamp(17px,2.8vh,22px); color:var(--muted)}

  /* start page */
  #start{flex:1; min-height:0; display:flex; flex-direction:column}
  .shead{display:flex; align-items:center; justify-content:center; gap:16px; padding:clamp(10px,3vh,28px) 16px clamp(6px,1.5vh,14px); flex:0 0 auto}
  .shead img{height:clamp(80px,17vh,160px); animation:wiggle2 2.6s ease-in-out infinite}
  @keyframes wiggle2{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  .shead h1{margin:0; font-size:clamp(32px,min(7vh,10vw),66px); line-height:1.05; color:#1A62A8; text-shadow:3px 3px 0 #fff}
  .shead p{margin:6px 0 0; font-size:clamp(17px,2.8vh,24px); background:#fff; display:inline-block; padding:2px 12px; border-radius:12px; border:3px solid #1A62A8}
  .tiles{flex:1; min-height:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(12px,2.2vh,20px); padding:clamp(8px,2vh,20px) 16px clamp(18px,3.5vh,32px); max-width:960px; width:100%; margin:0 auto}
  .ttile{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; border-radius:26px; border:5px solid var(--d); background:var(--b); color:var(--i); box-shadow:0 7px 0 var(--d);
         font-size:clamp(20px,min(3.8vh,5.6vw),34px); font-weight:700; min-height:0; overflow:hidden; padding:10px; transition:transform .1s, box-shadow .1s; font-family:inherit}
  .ttile:active{transform:translateY(5px); box-shadow:0 1px 0 var(--d)}
  .bubble{background:#fff; border-radius:50%; aspect-ratio:1; height:min(55%,180px); flex:0 1 auto; display:flex; align-items:center; justify-content:center; border:4px solid var(--d); min-height:0}
  .bubble img{max-width:78%; max-height:78%}
  @media (orientation:landscape) and (min-width:640px){ .tiles{grid-template-columns:repeat(4,minmax(0,1fr)); max-width:1100px} .ttile{font-size:clamp(16px,min(3.6vh,2.3vw),28px)} }
  .ttile{line-height:1.15; text-align:center}
  .hidden{display:none !important}
  @media (max-height:520px){
    header{padding:4px 10px; border-bottom-width:4px} .imgbubble{width:36px; height:36px}
    main{padding:6px 10px; gap:6px} .screen{gap:6px}
    .hint{font-size:15px; padding:3px 8px} .btn{padding:5px 16px; font-size:17px; box-shadow:0 4px 0 var(--acc-dark)}
    .question{padding:6px 10px; font-size:20px; box-shadow:0 4px 0 var(--acc-dark)} .clock{font-size:22px}
    .inputwrap{gap:6px; flex-direction:row; flex-wrap:wrap; align-content:center} .inputwrap input{font-size:22px; padding:4px 10px; width:min(60%,420px)} .feedback{order:3; width:100%; min-height:0}
    .shead{padding:6px 16px 4px} .shead img{height:64px} .shead h1{font-size:32px}
    .praise img{max-height:16vh} .praise{padding:12px}
  }
</style>
</head>
<body>
<div id="start">
  <div class="shead">
    <img id="s-img" alt="Wecker mit Pokal">
    <div><h1>Zeit-Champion</h1><p>Wähle ein Thema.</p></div>
  </div>
  <nav class="tiles" id="tiles"></nav>
</div>
<header id="head" class="hidden">
  <a class="back" href="#">← Übersicht</a>
  <h1 id="h-title"></h1>
  <div class="imgbubble"><img id="h-img" alt=""></div>
</header>
<main id="main" class="hidden"></main>
<div class="overlay" id="praise">
  <div class="praise">
    <img id="p-img" alt="Wecker mit Pokal">
    <h2 id="p-title"></h2>
    <p id="p-text"></p>
    <div class="bar">
      <button class="btn light" id="p-menu">Übersicht</button>
      <button class="btn" id="p-again">Nochmal</button>
    </div>
  </div>
</div>
<canvas id="confetti"></canvas>

    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += .1; ctx.fillStyle = p.c; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r); ctx.restore(); });
    if (++t < 160) requestAnimationFrame(step); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}
function praise(title, text, again){
  $('p-title').textContent = title; $('p-text').textContent = text; againFn = again;
  $('praise').classList.add('on'); confetti();
}
$('p-menu').onclick = () => { $('praise').classList.remove('on'); menu(); };
$('p-again').onclick = () => { $('praise').classList.remove('on'); if (againFn) againFn(); };

function screen(){ if (cleanup) { cleanup(); cleanup = null; } relayout = null; main.innerHTML = ''; const s = el('section','screen'); main.appendChild(s); return s; }
function backBar(extra = []){ const b = el('div','bar'); const z = el('button','btn light','Zurück'); z.onclick = menu; b.appendChild(z); extra.forEach(x => b.appendChild(x)); return b; }
function hint(t){ return el('p','hint',t); }
function progress(n, i){ return el('div','progress', Array.from({length:n}, (_,k) => `<span class="dot ${k < i ? 'done' : k === i ? 'now' : ''}"></span>`).join('')); }

/* ---------- fit helper: sizes a grid of n cells to the space available ---------- */
let relayout = null;
addEventListener('resize', () => relayout && relayout());
function fitGrid(box, n, o = {}){
  const idealW = o.idealW || 170, idealH = o.idealH || 64, maxH = o.maxH || 96, gap = o.gap || 10, chars = o.chars || 10, extraW = o.extraW || 0;
  const W = box.clientWidth, H = box.clientHeight;
  if (!W || !H) return;
  let best = null;
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c), w = (W - (c - 1) * gap) / c, h = (H - (r - 1) * gap) / r;
    const score = Math.min(w / idealW, h / idealH, 1.6);
    if (!best || score > best.score + 0.001) best = { c, r, w, h, score };
  }
  const rh = Math.max(24, Math.min(best.h, maxH));
  box.style.gridTemplateColumns = `repeat(${best.c}, minmax(0,1fr))`;
  box.style.gridTemplateRows = `repeat(${best.r}, ${rh}px)`;
  const fs = Math.max(13, Math.min(rh * 0.42, (best.w - extraW - 12) / (0.56 * chars + 0.6), o.maxFs || 32));
  box.style.setProperty('--fs', fs.toFixed(1) + 'px');
  return { ...best, rh, fs };
}
const longest = arr => Math.max(...arr.map(x => String(x).length));

/* ---------- drag helper ---------- */
function draggable(card, {findTarget, onDrop, onTap}){
  let sx, sy, moved = false, target = null;
  card.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; moved = false; target = null; card.setPointerCapture(e.pointerId); });
  card.addEventListener('pointermove', e => {
    if (sx === undefined) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && Math.hypot(dx,dy) > 8) { moved = true; card.classList.add('drag'); }
    if (!moved) return;
    card.style.transform = `translate(${dx}px,${dy}px)`;
    card.style.pointerEvents = 'none';
    const t = findTarget(document.elementFromPoint(e.clientX, e.clientY));
    card.style.pointerEvents = '';
    if (target && target !== t) target.classList.remove('target');
    target = (t && t !== card) ? t : null;
    if (target) target.classList.add('target');
  });
  const end = () => {
    if (sx === undefined) return; sx = undefined;
    card.classList.remove('drag'); card.style.transform = '';
    if (moved) { if (target) { target.classList.remove('target'); onDrop(target); } }
    else onTap();
  };
  card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
}

/* ---------- menu ---------- */
function menu(){
  const s = screen();
  const top = el('div','menu-top'); top.innerHTML = `<img src="${IMG}" alt="">`; s.appendChild(top);
  const m = el('div','menu fit');
  C.modes.forEach(md => {
    const t = el('button','tile', `<span class="ico">${md.icon}</span><b>${md.label}</b><small>${md.sub}</small>`);
    t.onclick = () => MODES[md.type](md); m.appendChild(t);
  });
  s.appendChild(m);
  relayout = () => { const r = fitGrid(m, C.modes.length, { idealW: 200, idealH: 120, maxH: 170, gap: 14, chars: 12, maxFs: 28 });
    if (r) { m.classList.toggle('compact', r.rh < 124); m.classList.toggle('tiny', r.rh < 84); } };
  requestAnimationFrame(relayout);
}

const MODES = {
  /* ----- Reihenfolge ----- */
  order(md){
    const s = screen(), items = C.items;
    s.appendChild(hint(md.hint));
    const box = el('div', 'order fit'); s.appendChild(box);
    relayout = () => fitGrid(box, items.length, { idealW: 210, idealH: 54, maxH: 74, gap: 8, chars: longest(items), extraW: 40 });
    let selected = null;
    const clear = () => box.querySelectorAll('.card').forEach(c => c.classList.remove('ok','bad'));
    const swap = (a,b) => { const pa = a.parentNode, pb = b.parentNode; pa.appendChild(b); pb.appendChild(a); clear(); };
    function build(){
      box.innerHTML = ''; selected = null;
      let mix; do { mix = shuffle(items); } while (mix.every((d,i) => d === items[i]));
      mix.forEach((d,i) => {
        const row = el('div','row', `<div class="num">${i+1}.</div>`);
        const c = el('div','card', d); c.dataset.v = d; row.appendChild(c); box.appendChild(row);
        draggable(c, {
          findTarget: t => t && t.closest('.order .card'),
          onDrop: t => { if (selected) { selected.classList.remove('sel'); selected = null; } swap(c, t); },
          onTap: () => {
            if (!selected) { selected = c; c.classList.add('sel'); }
            else if (selected === c) { c.classList.remove('sel'); selected = null; }
            else { selected.classList.remove('sel'); swap(selected, c); selected = null; }
          }
        });
      });
      requestAnimationFrame(relayout);
    }
    build();
    const mix = el('button','btn light','Neu mischen'); mix.onclick = build;
    const chk = el('button','btn','Prüfen');
    chk.onclick = () => {
      let all = true;
      box.querySelectorAll('.row').forEach((row,i) => { const c = row.querySelector('.card'); const ok = c.dataset.v === items[i]; c.classList.toggle('ok', ok); c.classList.toggle('bad', !ok); if (!ok) all = false; });
      if (all) setTimeout(() => praise('Super!', md.praise, () => MODES.order(md)), 500);
    };
    s.appendChild(backBar([mix, chk]));
  },

  /* ----- Abschreiben ----- */
  copy(md){
    const s = screen(), items = C.items;
    let i = 0, first = 0, tries = 0;
    const prog = el('div'); s.appendChild(prog);
    const q = el('div','question'); s.appendChild(q);
    const wrap = el('div','inputwrap');
    const inp = el('input'); inp.type = 'text';
    ['autocomplete','autocorrect','autocapitalize','spellcheck'].forEach(a => inp.setAttribute(a, a === 'spellcheck' ? 'false' : 'off'));
    const fb = el('div','feedback');
    const ok = el('button','btn','Prüfen');
    wrap.append(inp, fb, ok); s.appendChild(wrap);
    s.appendChild(backBar());
    function show(){
      prog.replaceChildren(progress(items.length, i));
      q.innerHTML = `<small>Schreibe ab:</small><span class="word">${items[i]}</span>`;
      inp.value = ''; inp.className = ''; fb.textContent = ''; tries = 0; inp.focus();
    }
    function check(){
      const v = inp.value.trim();
      if (!v) { fb.textContent = 'Schreibe zuerst das Wort.'; return; }
      if (v === items[i]) {
        if (tries === 0) first++;
        inp.className = 'ok'; kick(q,'pop'); fb.textContent = 'Richtig!';
        ok.disabled = true;
        setTimeout(() => { ok.disabled = false; i++; if (i < items.length) show(); else praise('Super!', `${first} von ${items.length} Wörtern waren beim ersten Versuch richtig.`, () => MODES.copy(md)); }, 800);
      } else {
        tries++; inp.className = 'bad'; kick(inp,'shake');
        fb.textContent = v.toLowerCase() === items[i].toLowerCase() ? 'Fast! Achte auf den Grossbuchstaben am Anfang.' : 'Vergleiche Buchstabe für Buchstabe.';
      }
    }
    ok.onclick = check;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
    inp.addEventListener('input', () => { if (inp.className === 'bad') { inp.className = ''; fb.textContent = ''; } });
    show();
  },

  /* ----- Lückenwörter ----- */
  gap(md){
    const s = screen();
    const rk = 'zeitchampion-' + C.key + '-gaprunde', round = +(store.get(rk) || 0); store.set(rk, round + 1);
    const list = shuffle(C.gaps.map(g => round === 0 ? g[0] : round === 1 ? g[1] : g[Math.floor(Math.random() * g.length)]));
    let i = 0, first = 0, tried = false, locked = false;
    const prog = el('div'); s.appendChild(prog);
    s.appendChild(hint('Welche Buchstaben fehlen?'));
    const q = el('div','question'); s.appendChild(q);
    const ans = el('div','answers fit'); s.appendChild(ans);
    s.appendChild(backBar());
    function show(){
      const g = list[i]; tried = false;
      prog.replaceChildren(progress(list.length, i));
      q.innerHTML = `<span class="word">${g.pre}<span class="gapbox" id="gb">&nbsp;</span>${g.post}</span>` + (g.hint ? `<small>${g.hint}</small>` : '');
      
      ans.innerHTML = '';
      shuffle(g.opts).forEach(o => {
        const b = el('button','card', o);
        b.onclick = () => {
          if (locked) return;
          if (o === g.opts[0]) {
            if (!tried) first++;
            b.classList.add('ok'); $('gb').textContent = o; kick(q,'pop'); locked = true;
            setTimeout(() => { locked = false; i++; if (i < list.length) show(); else praise('Super!', `${first} von ${list.length} Lücken hast du beim ersten Versuch richtig gefüllt.`, () => MODES.gap(md)); }, 900);
          } else { tried = true; b.classList.add('bad'); kick(b,'shake'); }
        };
        ans.appendChild(b);
      });
      relayout = () => fitGrid(ans, g.opts.length, { idealW: 140, idealH: 90, maxH: 120, gap: 12, chars: 3, maxFs: 40 });
      requestAnimationFrame(relayout);
    }
    show();
  },

  /* ----- Wettrennen ----- */
  race(md){
    const s = screen(), items = C.items, key = 'zeitchampion-' + C.key + '-best';
    const fmt = ms => (ms/1000).toFixed(1) + ' s';
    const best = store.get(key);
    s.appendChild(hint(best ? `Deine Bestzeit: ${fmt(+best)}. Schaffst du es schneller? ${md.start}` : md.hint));
    const clock = el('div','clock','0.0 s'); s.appendChild(clock);
    const found = el('div','found'); s.appendChild(found);
    const grid = el('div','grid fit'); s.appendChild(grid);
    relayout = () => fitGrid(grid, items.length, { idealW: 160, idealH: 60, maxH: 90, gap: 10, chars: longest(items) });
    requestAnimationFrame(relayout);
    items.forEach(() => { const c = el('button','card','?'); c.disabled = true; grid.appendChild(c); });
    let next = 0, t0 = 0, timer = null;
    cleanup = () => clearInterval(timer);
    const go = el('button','btn','Los!');
    go.onclick = () => {
      go.style.display = 'none'; grid.innerHTML = '';
      shuffle(items).forEach(d => {
        const c = el('button','card', d);
        c.onclick = () => {
          if (d === items[next]) {
            c.classList.add('ok','done'); c.disabled = true; found.appendChild(el('span','chip', d)); next++;
            if (next === items.length) {
              const ms = performance.now() - t0; clearInterval(timer); clock.textContent = fmt(ms);
              const b = store.get(key), rec = !b || ms < +b; if (rec) store.set(key, Math.round(ms));
              setTimeout(() => praise(rec ? 'Neuer Rekord!' : 'Geschafft!', `Deine Zeit: ${fmt(ms)}` + (rec ? '' : ` – Bestzeit: ${fmt(+b)}`), () => MODES.race(md)), 400);
            }
          } else { c.classList.add('bad'); kick(c,'shake'); setTimeout(() => c.classList.remove('bad'), 400); }
        };
        grid.appendChild(c);
      });
      t0 = performance.now(); timer = setInterval(() => clock.textContent = fmt(performance.now() - t0), 100);
    };
    s.appendChild(backBar([go]));
  },

  /* ----- Rätsel / Auswahl ----- */
  quiz(md){
    const s = screen(), list = GEN[md.gen]();
    let i = 0, first = 0, tried = false, locked = false;
    const prog = el('div'); s.appendChild(prog);
    if (md.hint) s.appendChild(hint(md.hint));
    const q = el('div','question'); s.appendChild(q);
    const ans = el('div','answers fit'); s.appendChild(ans);
    s.appendChild(backBar());
    function show(){
      const it = list[i]; tried = false;
      prog.replaceChildren(progress(list.length, i));
      q.innerHTML = it.text;
      
      ans.innerHTML = '';
      it.opts.forEach(o => {
        const b = el('button','card', o);
        b.onclick = () => {
          if (locked) return;
          if (o === it.ans) {
            if (!tried) first++; b.classList.add('ok'); kick(b,'pop'); locked = true;
            setTimeout(() => { locked = false; i++; if (i < list.length) show(); else praise(first >= list.length - 2 ? 'Super!' : 'Gut gemacht!', `${first} von ${list.length} Aufgaben hast du beim ersten Versuch gelöst.`, () => MODES.quiz(md)); }, 800);
          } else { tried = true; b.classList.add('bad'); kick(b,'shake'); }
        };
        ans.appendChild(b);
      });
      relayout = () => fitGrid(ans, it.opts.length, { idealW: longest(it.opts) > 12 ? 240 : 160, idealH: 80, maxH: 110, gap: 12, chars: longest(it.opts) });
      requestAnimationFrame(relayout);
    }
    show();
  },

  /* ----- Eingabe (Datum) ----- */
  input(md){
    const s = screen(), list = GEN[md.gen]();
    let i = 0, first = 0, tries = 0;
    const prog = el('div'); s.appendChild(prog);
    s.appendChild(hint(md.hint));
    const q = el('div','question'); s.appendChild(q);
    const wrap = el('div','inputwrap');
    const inp = el('input'); inp.type = 'text'; inp.setAttribute('inputmode', md.inputmode || 'text');
    ['autocomplete','autocorrect','autocapitalize'].forEach(a => inp.setAttribute(a,'off')); inp.setAttribute('spellcheck','false');
    inp.placeholder = md.placeholder || '';
    const fb = el('div','feedback'); const ok = el('button','btn','Prüfen');
    wrap.append(inp, fb, ok); s.appendChild(wrap); s.appendChild(backBar());
    function show(){ prog.replaceChildren(progress(list.length, i)); q.innerHTML = list[i].text; inp.value = ''; inp.className = ''; fb.textContent = ''; tries = 0; inp.focus(); }
    function check(){
      const it = list[i], v = inp.value.trim();
      if (!v) { fb.textContent = 'Schreibe zuerst deine Antwort.'; return; }
      if (it.check(v)) {
        if (tries === 0) first++; inp.className = 'ok'; kick(q,'pop'); fb.textContent = 'Richtig!'; ok.disabled = true;
        setTimeout(() => { ok.disabled = false; i++; if (i < list.length) show(); else praise('Super!', `${first} von ${list.length} Daten waren beim ersten Versuch richtig.`, () => MODES.input(md)); }, 900);
      } else {
        tries++; inp.className = 'bad'; kick(inp,'shake');
        fb.textContent = tries >= 2 ? `So wäre es richtig: ${it.solution}` : it.tip(v);
      }
    }
    ok.onclick = check;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
    inp.addEventListener('input', () => { if (inp.className === 'bad') inp.className = ''; });
    show();
  },

  /* ----- Zuordnen ----- */
  sort(md){
    const s = screen();
    s.appendChild(hint(md.hint));
    const pool = el('div','pool'); s.appendChild(pool);
    const bk = el('div','baskets'); s.appendChild(bk);
    s.appendChild(backBar());
    let selected = null, left = 0;
    const owner = {};
    md.groups.forEach(g => g.items.forEach(it => owner[it] = g.name));
    const baskets = md.groups.map(g => {
      const b = el('div','basket', `<h3>${g.name}</h3><div class="in"></div>`);
      b.style.borderColor = g.color; b.querySelector('h3').style.color = g.dark; b.dataset.g = g.name;
      b.onclick = () => { if (selected) place(selected, b); };
      bk.appendChild(b); return b;
    });
    function place(card, b){
      card.classList.remove('sel'); if (selected === card) selected = null;
      if (owner[card.dataset.v] === b.dataset.g) {
        const chip = el('span','chip', card.dataset.v); b.querySelector('.in').appendChild(chip); kick(chip,'pop');
        card.remove(); left--;
        if (left === 0) setTimeout(() => praise('Super!', md.praise, () => MODES.sort(md)), 400);
      } else { kick(card,'shake'); kick(b,'flash'); }
    }
    shuffle(Object.keys(owner)).forEach(v => {
      const c = el('div','card', v); c.dataset.v = v; pool.appendChild(c); left++;
      draggable(c, {
        findTarget: t => t && t.closest('.basket'),
        onDrop: t => place(c, t),
        onTap: () => { if (selected === c) { c.classList.remove('sel'); selected = null; return; } if (selected) selected.classList.remove('sel'); selected = c; c.classList.add('sel'); }
      });
    });
  },
};


/* ---------- routing ---------- */
const img = k => 'data:image/png;base64,' + IMGS[k];
$('s-img').src = img('titel'); $('p-img').src = img('titel');
Object.entries(TOPICS).forEach(([key, t]) => {
  const b = el('button', 'ttile', `<span class="bubble"><img src="${img(t.img)}" alt=""></span>${t.title}`);
  b.style.setProperty('--b', t.colors[0]); b.style.setProperty('--d', t.colors[1]); b.style.setProperty('--i', t.colors[3]);
  b.onclick = () => { location.hash = key; };
  $('tiles').appendChild(b);
});
function route(){
  const key = location.hash.slice(1);
  $('praise').classList.remove('on');
  if (cleanup) { cleanup(); cleanup = null; }
  if (!TOPICS[key]) {
    $('start').classList.remove('hidden'); $('head').classList.add('hidden'); $('main').classList.add('hidden');
    document.title = 'Zeit-Champion'; return;
  }
  C = TOPICS[key]; GEN = C.gens || {}; IMG = img(C.img);
  const r = document.documentElement.style;
  ['--acc','--acc-dark','--acc-bg','--head-ink'].forEach((v,i) => r.setProperty(v, C.colors[i]));
  $('h-title').textContent = C.title; $('h-img').src = IMG; document.title = C.title + ' – Zeit-Champion';
  $('start').classList.add('hidden'); $('head').classList.remove('hidden'); $('main').classList.remove('hidden');
  menu();
}
addEventListener('hashchange', route);
route();
